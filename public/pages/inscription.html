<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — LibreService</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="inscription">
<header class="entete" id="entete"></header>

<main class="conteneur">
  <h1 class="section-titre" style="margin-top:20px;">Créer un compte</h1>

  <div class="carte">
    <div class="onglets">
      <button type="button" class="onglet" data-role="client">Je cherche un service</button>
      <button type="button" class="onglet" data-role="prestataire">Je propose un service</button>
    </div>

    <div id="zone-message"></div>

    <form id="form-inscription">
      <div class="champ">
        <label for="nom">Nom complet</label>
        <input type="text" id="nom" required>
      </div>
      <div class="champ">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="champ">
        <label for="telephone">Téléphone</label>
        <input type="tel" id="telephone" placeholder="ex: 077 12 34 56" required>
      </div>
      <div class="champ">
        <label for="quartier">Quartier</label>
        <select id="quartier" required><option value="">Sélectionnez votre quartier</option></select>
      </div>
      <div class="champ">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" minlength="6" required>
        <div class="aide">6 caractères minimum</div>
      </div>

      <div id="zone-prestataire" style="display:none;">
        <div class="champ">
          <label for="categorie">Catégorie de service</label>
          <select id="categorie"><option value="">Sélectionnez une catégorie</option></select>
        </div>
        <div class="champ">
          <label for="metier">Métier précis</label>
          <input type="text" id="metier" placeholder="ex: Plombier, Coiffeuse, Professeur de maths...">
        </div>
        <div class="champ">
          <label for="tarif_indicatif">Tarif indicatif</label>
          <input type="text" id="tarif_indicatif" placeholder="ex: à partir de 5 000 FCFA">
        </div>
        <div class="champ">
          <label for="description">Description de votre activité</label>
          <textarea id="description" placeholder="Présentez votre expérience, vos services..."></textarea>
        </div>
        <div class="alerte" style="background:#fdf3e3; color:#8a5a00;">
          ℹ️ Votre profil sera visible publiquement après validation par notre équipe (sous 48h en général).
        </div>
      </div>

      <button type="submit" class="btn pleine-largeur" id="btn-inscription">Créer mon compte</button>
    </form>
    <p style="text-align:center; margin-top:14px; font-size:0.9rem;">
      Déjà inscrit ? <a href="/pages/connexion.html">Connectez-vous</a>
    </p>
  </div>
</main>

<p class="pied">LibreService — MVP • Libreville, Gabon</p>

<script src="/js/app.js"></script>
<script>
let roleActuel = new URLSearchParams(window.location.search).get('role') === 'prestataire' ? 'prestataire' : 'client';

function majOnglets() {
  document.querySelectorAll('.onglet').forEach(btn => {
    btn.classList.toggle('actif', btn.dataset.role === roleActuel);
  });
  document.getElementById('zone-prestataire').style.display = roleActuel === 'prestataire' ? 'block' : 'none';
  document.getElementById('categorie').required = roleActuel === 'prestataire';
  document.getElementById('metier').required = roleActuel === 'prestataire';
}

document.querySelectorAll('.onglet').forEach(btn => {
  btn.addEventListener('click', () => { roleActuel = btn.dataset.role; majOnglets(); });
});

async function chargerReferences() {
  const ref = await api('/prestataires/reference');
  const selQuartier = document.getElementById('quartier');
  ref.quartiers.forEach(q => {
    const opt = document.createElement('option');
    opt.value = q; opt.textContent = q;
    selQuartier.appendChild(opt);
  });
  const selCat = document.getElementById('categorie');
  ref.categories.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.label;
    selCat.appendChild(opt);
  });
}

document.getElementById('form-inscription').addEventListener('submit', async (e) => {
  e.preventDefault();
  viderAlerte('zone-message');

  const payload = {
    nom: document.getElementById('nom').value.trim(),
    email: document.getElementById('email').value.trim(),
    telephone: document.getElementById('telephone').value.trim(),
    quartier: document.getElementById('quartier').value,
    password: document.getElementById('password').value,
    role: roleActuel,
  };

  if (roleActuel === 'prestataire') {
    payload.categorie = document.getElementById('categorie').value;
    payload.metier = document.getElementById('metier').value.trim();
    payload.tarif_indicatif = document.getElementById('tarif_indicatif').value.trim();
    payload.description = document.getElementById('description').value.trim();
  }

  const btn = document.getElementById('btn-inscription');
  btn.disabled = true; btn.textContent = 'Création en cours...';

  try {
    const data = await api('/auth/inscription', { method: 'POST', body: JSON.stringify(payload) });
    Session.setSession(data.token, data.user);
    window.location.href = roleActuel === 'prestataire' ? '/pages/profil.html' : '/pages/recherche.html';
  } catch (err) {
    afficherAlerte('zone-message', err.message, 'erreur');
    btn.disabled = false; btn.textContent = 'Créer mon compte';
  }
});

majOnglets();
chargerReferences();
</script>
</body>
</html>
