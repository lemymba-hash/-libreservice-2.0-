/* =====================================================
   INITIALISATION ADMIN
===================================================== */

function initialiserAdmin() {

    if (!utilisateur) return;


    const nom =
    utilisateur.nom || 'Administrateur';


    document.getElementById('admin-nom')
        .textContent = nom;


    const initiales =
    nom
    .split(' ')
    .map(n => n.charAt(0))
    .join('')
    .substring(0, 2)
    .toUpperCase();


    document.getElementById(
        'admin-initiales'
    ).textContent = initiales;

}



initialiserAdmin();



/* =====================================================
   CHANGER PAGE
===================================================== */

function changerPage(page) {


    pageActive = page;


    document
    .querySelectorAll('.admin-menu-item')
    .forEach(item => {

        item.classList.remove('actif');

    });


    const menu =
    document.getElementById(
        'menu-' + page
    );


    if (menu) {

        menu.classList.add('actif');

    }


    chargerPage(page);

}

/* =====================================================
   FILTRER UTILISATEURS
===================================================== */

function filtrerUtilisateurs() {


    const role =
    document.getElementById(
        'filtre-role'
    ).value;


    const recherche =
    document.getElementById(
        'recherche-utilisateur'
    ).value
    .toLowerCase();


    document
    .querySelectorAll(
        '#liste-utilisateurs tr'
    )
    .forEach(ligne => {


        const correspondRole =
        !role ||
        ligne.dataset.role === role;


        const correspondRecherche =
        ligne.dataset.search
        .includes(recherche);


        ligne.style.display =
        correspondRole &&
        correspondRecherche

        ? ''

        : 'none';


    });

}

            ...p,
            statut: 'valide'

        ...attente.prestataires.map(p => ({
            ...p,
            statut: 'en_attente'
        })),

        ...refuses.prestataires.map(p => ({
            ...p,
            statut: 'refuse'
        }))

    ];


    contenu.innerHTML = `


    <div class="admin-card">


        <div class="admin-toolbar">


            <div class="filter-group">


                <select
                class="admin-select"
                id="filtre-prestataire"

                        Validés

                    </option>


                    <option value="en_attente">

                        En attente

                    </option>

                        Refusés

                </select>


            </div>


            <div>

                ${prestataires.length}
                professionnel(s)

            </div>


        </div>



        <div class="admin-table-wrapper">


            <table class="admin-table">


                <thead>

                    <tr>

                        <th>Professionnel</th>

                        <th>Métier</th>

                        <th>Localisation</th>

                        <th>Statut</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="liste-prestataires">


                    ${prestataires.map(p => `


                    <tr
                    data-statut="${p.statut}"
                    >


                        <td>


                            <div class="user-cell">


                                <div class="table-avatar">

                                    ${initialesNom(p.nom)}

                                </div>


                                <div>


                                    <div class="table-name">

                                        ${echapperHtml(p.nom)}

                                    </div>


                                    <div class="table-subtext">

                                        ${echapperHtml(p.email)}

                                    </div>


                                </div>


                            </div>


                        </td>



                        <td>

                            ${echapperHtml(p.metier)}

                        </td>



                        <td>

                            ${echapperHtml(
                                p.quartier || '—'
                            )}

                        </td>



                        <td>

                        <td>

                                    p.statut !== 'valide'

                                    <button

                                        ${p.id},

                                    <button

                                        ${p.id},
                                        'refuse'
                                    )"
                                    >

                                    ''

                        </td>

                    `).join('')}

    </div>

/* =====================================================
   FILTRE PRESTATAIRES
===================================================== */

function filtrerPrestataires() {


    const statut =
    document.getElementById(
        'filtre-prestataire'
    ).value;


    document
    .querySelectorAll(
        '#liste-prestataires tr'
    )
    .forEach(ligne => {


        ligne.style.display =

        !statut ||

        ligne.dataset.statut === statut

        ? ''

        : 'none';


    });

}

/* =====================================================

===================================================== */

async function changerStatutPrestataire(
    id,
    statut
) {


    const message =

    statut === 'valide'

    ?

    'Voulez-vous valider ce prestataire ?'

    :

    'Voulez-vous refuser ce prestataire ?';


    if (!confirm(message)) {

        return;

    }


    try {


        await api(

            '/admin/prestataires/' +
            id +
            '/statut',

            {

                method: 'PUT',

                body:
                JSON.stringify({
                    statut
                })

            }

        );


        alert(
            'Statut modifié avec succès.'
        );


        changerPage(
            pageActive
        );


    }

    catch (e) {

        alert(e.message);

    }

}

    id,

) {

}



/* =====================================================
   CHARGEMENT DES PAGES
===================================================== */

async function chargerPage(page) {


    mettreAJourTitre(page);


    contenu.innerHTML = `

    <div class="admin-empty">

        Chargement...

    </div>

    `;


    try {


        if (page === 'dashboard') {

            await afficherDashboard();

        }


        else if (
            page === 'utilisateurs'
        ) {

            await afficherUtilisateurs();

        }


        else if (
            page === 'prestataires'
        ) {

            await afficherPrestataires();

        }


        else if (
            page === 'validations'
        ) {

            await afficherValidations();

        }


        else if (
            page === 'avis'
        ) {

            await afficherAvis();

        }


        else if (
            page === 'statistiques'
        ) {

            await afficherStatistiques();

        }


        else if (
            page === 'activite'
        ) {

            await afficherActivite();

        }


        else if (
            page === 'parametres'
        ) {

            afficherParametres();

        }


    }

    catch (e) {


        contenu.innerHTML = `


        <div class="admin-card">


            <div class="admin-empty">


                <div class="admin-empty-icon">

                    ⚠️

                </div>


                <h3>

                    Erreur de chargement

                </h3>


                <p>

                    ${echapperHtml(
                        e.message
                    )}

                </p>


                <button
                class="admin-btn admin-btn-primary"
                onclick="chargerPage(
                    '${page}'
                )"
                >

                    Réessayer

                </button>


            </div>


        </div>


        `;


    }

}



/* =====================================================
   OUTILS
===================================================== */

function initialesNom(nom) {


    if (!nom) return '?';


    return nom
        .split(' ')
        .map(partie =>
            partie.charAt(0)
        )
        .join('')
        .substring(0, 2)
        .toUpperCase();

}



function badgeRole(role) {


    if (role === 'admin') {

        return `

        <span
        class="status-badge status-admin"
        >

            Administrateur

        </span>

        `;

    }


    if (role === 'prestataire') {

        return `

        <span
        class="status-badge status-valide"
        >

            Prestataire

        </span>

        `;

    }


    return `

    <span
    class="status-badge status-client"
    >

        Client

    </span>

    `;

}



function badgeStatut(statut) {


    const textes = {

        valide:
        'Validé',

        en_attente:
        'En attente',

        refuse:
        'Refusé'

    };


    const classes = {

        valide:
        'status-valide',

        en_attente:
        'status-attente',

        refuse:
        'status-refuse'

    };


    return `

    <span
    class="
        status-badge
        ${classes[statut]}
    "
    >

        ${textes[statut]}

    </span>

    `;

}



function formaterDate(date) {


    if (!date) return '—';


    try {


        return new Date(date)
        .toLocaleDateString(

            'fr-FR',

            {

                day: '2-digit',

                month: 'short',

                year: 'numeric'

            }

        );


    }

    catch {

        return date;

    }

}



function calculerTauxValidation(s) {


    if (
        !s.nb_prestataires_inscrits
    ) {

        return 0;

    }


    return Math.round(

        (
            s.nb_prestataires_valides /
            s.nb_prestataires_inscrits
        )

        * 100

    );

}
